name: SeniorITa AI Governance Validation

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main

jobs:

  governance-validation:

    name: Validate AI Framework

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Validate agents structure
        run: |
          echo "Checking AI agents..."

          test -f .github/agents.yaml
          test -f .github/governance.yaml

          test -f .github/agents/architect.agent.md
          test -f .github/agents/developer.agent.md
          test -f .github/agents/security.agent.md
          test -f .github/agents/reviewer.agent.md
          test -f .github/agents/test.agent.md
          test -f .github/agents/release.agent.md
          test -f .github/agents/devops.agent.md
          test -f .github/agents/documentation.agent.md


      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          import yaml

          files=[
            ".github/agents.yaml",
            ".github/governance.yaml"
          ]

          for file in files:
              with open(file) as f:
                  yaml.safe_load(f)

          print("YAML validation successful")
          PY


      - name: Governance check
        run: |
          echo "SeniorITa governance validation completed"
          echo "Architecture gates enabled"
          echo "Security gates enabled"
          echo "Testing gates enabled"


      - name: Success
        run: |
          echo "SeniorITa AI Framework READY"
