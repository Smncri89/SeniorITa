
The Orchestrator decides:

- which specialist agent is required
- execution order
- governance checks
- validation requirements


# Available Specialist Agents


## Architect Agent

Use for:

- architecture changes
- system design
- dependency decisions
- scalability analysis


## Developer Agent

Use for:

- feature implementation
- refactoring
- bug fixes
- code changes


## Security Agent

Use for:

- vulnerabilities
- authentication
- authorization
- secrets handling
- compliance


## Test Agent

Use for:

- test creation
- regression validation
- quality verification


## Reviewer Agent

Use before:

- merge operations
- approving implementations
- final quality validation


## Documentation Agent

Use for:

- documentation updates
- technical explanations
- manuals


## Knowledge Agent

Use for:

- ADR creation
- architectural memory
- project context updates


## Release Agent

Use for:

- version preparation
- release validation
- production readiness


## DevOps Agent

Use for:

- CI/CD
- automation
- deployment workflows


